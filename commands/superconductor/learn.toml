description = "Inspect, vet, harvest, promote, or discard continuous learning skills"
prompt = """
Inspect, vet, harvest, promote, or discard continuous learning skills.

Usage:
superconductor learn --list [--json]
superconductor learn --inspect <skill> [--json]
superconductor learn --promote <skill> [--scope <project|global>] [--json]
superconductor learn --discard <skill> [--json]
superconductor learn --harvest [--remediations] [--track <id>] [--json]

Flags:
- `--list`: List all incubating skills with confidence score, vetting status, and source track
- `--inspect <skill>`: Inspect candidate SKILL.md and automated vetting report
- `--promote <skill>`: Promote candidate skill to active status
- `--scope <project|global>`: Target scope for promotion (default: project)
- `--discard <skill>`: Discard incubating skill candidate from staging
- `--harvest`: Harvest trajectories and distill candidate skills from track runs
- `--remediations`: Harvest focused contrastive micro-skills from track remediation cycles
- `--track <id>`: Target track ID for harvesting
- `--json`: Output structured JSON for script consumption

The args provided by the user are: {{args}}
"""
