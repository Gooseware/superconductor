tasks:
  - id: "root"
    name: "Initialize Setup"
    description: "Sets up the project context"
    role: "architect"
    tier: 1
    files: ["package.json"]

  - id: "backend_setup"
    name: "Setup Backend"
    description: "Initializes backend structure"
    role: "architect"
    tier: 2
    files: ["src/backend/index.ts"]
    dependencies: ["root"]

  - id: "frontend_setup"
    name: "Setup Frontend"
    description: "Initializes frontend structure"
    role: "architect"
    tier: 2
    files: ["src/frontend/index.ts"]
    dependencies: ["root"]

  - id: "db_schema"
    name: "Design Database Schema"
    description: "Creates DB schema definitions"
    role: "editor"
    tier: 3
    files: ["src/backend/schema.ts"]
    dependencies: ["backend_setup"]

  - id: "api_routes"
    name: "Create API Routes"
    description: "Expose endpoints"
    role: "editor"
    tier: 3
    files: ["src/backend/routes.ts"]
    dependencies: ["db_schema"]

  - id: "ui_components"
    name: "Build UI Components"
    description: "React components"
    role: "editor"
    tier: 3
    files: ["src/frontend/components.ts"]
    dependencies: ["frontend_setup"]

  - id: "integration"
    name: "Integration"
    description: "Connect frontend to backend API"
    role: "editor"
    tier: 3
    files: ["src/frontend/api.ts"]
    dependencies: ["api_routes", "ui_components"]

  - id: "e2e_tests"
    name: "End to End Tests"
    description: "Write E2E tests"
    role: "editor"
    tier: 4
    files: ["tests/e2e.test.ts"]
    dependencies: ["integration"]
