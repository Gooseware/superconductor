name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/superconductor-core/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/superconductor-core

      - name: Build
        run: npm run build
        working-directory: packages/superconductor-core

      - name: Test
        run: npm test
        working-directory: packages/superconductor-core
