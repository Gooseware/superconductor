name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [superconductor-core, superconductor-kernel]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
        working-directory: packages/${{ matrix.package }}

      - name: Build
        run: pnpm run build --if-present
        working-directory: packages/${{ matrix.package }}

      - name: Test
        run: pnpm test --if-present
        working-directory: packages/${{ matrix.package }}
